version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to 6.x until dependency-cruiser supports TypeScript >= 7 (ADR-0008).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Types must match the Node runtime in .nvmrc (22); bump together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react-three:
        patterns: ["three", "@react-three/*", "@types/three"]
      tooling:
        patterns:
          - "@biomejs/*"
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "dependency-cruiser"
          - "typescript"
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
