version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-three:
        patterns: ["three", "@react-three/*", "@types/three"]
      tooling:
        patterns:
          - "@biomejs/*"
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "dependency-cruiser"
          - "typescript"
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
